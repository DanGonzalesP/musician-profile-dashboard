# Configuración del Supabase LOCAL de Vibe.
# Referencia: https://supabase.com/docs/guides/local-development/cli/config
#
# Para qué sirve: reproducir el esquema de producción en la máquina de quien
# desarrolla y en el runner de CI, para que `pnpm db:verify` y `pnpm test:db`
# corran contra una base reconstruida DESDE CERO con las migraciones de
# `supabase/migrations/`. Es lo que convierte el esquema de folclore en un
# artefacto verificable (P-14).
#
# ⚠️ NUNCA se usa contra producción. Los puertos son locales y las claves que
# imprime `supabase start` son las de desarrollo, públicas y sin valor.
#
# Requiere Docker Desktop corriendo (§8 del plan, acción humana #8).

project_id = "vibe"

# ─── PUERTOS: bloque 544xx, propio de Vibe ─────────────────────────────────
# El Supabase local del CLI usa 543xx por defecto, y ése es el bloque que ya
# ocupa el stack local de Bancary en esta misma máquina. Con los dos en 543xx
# pasan dos cosas, y la segunda es peor que la primera:
#
#   1. `supabase start` falla con "port is already allocated" — ruidoso, se ve.
#   2. Si Bancary arranca primero, `SUPABASE_TEST_URL=http://127.0.0.1:54321`
#      sigue respondiendo, pero es OTRA base. Las pruebas de Vibe crearían y
#      borrarían usuarios en el proyecto equivocado sin decir una palabra.
#
# El bloque 544xx elimina las dos de raíz y deja convivir los dos proyectos.
# La salvaguarda que cubre el caso 2 aunque alguien cambie esto vive en
# `test/database/helpers.ts` y `tests/e2e-auth/fixtures/sesion.ts`: antes de
# tocar nada comprueban que la base al otro lado sea de verdad la de Vibe.

[api]
enabled = true
# Bloque 544xx propio de Vibe. Ver la nota de puertos más abajo.
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Mismo tope que PostgREST aplica en la nube. Es la razón por la que
# /api/cleanup-orphaned-files tiene que paginar: si el local no lo replicara,
# el bug de las 1000 filas sería invisible en las pruebas.
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
health_timeout = "2m"
# ⚠️ TIENE QUE COINCIDIR CON PRODUCCIÓN.
# Confirmado en producción por `_diagnostico_estado.sql` el 2026-08-16.
# Mantener este valor sincronizado evita que el gate local dé una falsa
# tranquilidad al probar contra una versión distinta de PostgreSQL.
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Sin semilla: las pruebas de F7 crean sus propios usuarios efímeros y los
# limpian. Depender de datos sembrados hace que el orden de ejecución importe,
# que es justo lo que se quiere evitar.
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54423

[local_smtp]
# Buzón local para los correos de Auth (confirmación de cuenta). Lo necesitan
# las pruebas que crean usuarios.
enabled = true
port = 54424

[storage]
# Vibe NO usa Supabase Storage: los archivos viven en Cloudflare R2 y se suben
# con URL firmada directa desde el navegador. Se deja apagado para que el
# entorno local no sugiera una capacidad que la app no usa.
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# En local se deja en false para que las pruebas de F7 puedan crear usuarios
# sin pasar por el buzón.
#
# ⚠️ En PRODUCCIÓN esto debe estar en TRUE: es la alternativa sin proveedor al
# captcha en el registro (§F5 del plan, decisión humana #12). Supabase Auth ya
# lo soporta; no hace falta introducir un tercero.
enable_confirmations = false
secure_password_change = false

[auth.sessions]
# Sin caducidad forzada: replica el comportamiento del proyecto en la nube.

[analytics]
enabled = false

[edge_runtime]
# Vibe no usa Edge Functions de Supabase: la lógica de servidor vive en las
# rutas de API de Next, en Vercel.
enabled = false
