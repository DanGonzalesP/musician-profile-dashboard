packages:
  - "."

# Fuerza versiones parcheadas de dependencias transitivas que Next.js empaqueta
# en su propio árbol (postcss y sharp). Son bumps dentro de la misma major, sin
# cambios de API:
#   • postcss 8.4.31 → 8.5.x: herramienta de build de CSS; procesa el CSS del
#     propio proyecto (entrada de confianza), nunca entrada de un atacante.
#   • sharp 0.34 → 0.35: dep opcional de next/image; este proyecto usa
#     images.unoptimized, así que sharp ni se invoca en runtime.
# Sin esto, `pnpm audit --prod` reporta CVEs que en la práctica no son
# explotables aquí, pero que conviene cerrar para no enmascarar otras reales.
#
# Las seis de abajo cierran las 8 vulnerabilidades ALTAS que `pnpm audit`
# reportaba (F9). Las ocho eran TRANSITIVAS: ninguna dependencia directa está
# afectada, así que no hay nada que subir en package.json. Cada override es el
# parche MÍNIMO dentro de la major que ya estaba resuelta —5.0.7→5.0.9,
# 3.1.3→3.1.5, 10.2.0→10.3.1, 4.3.0→4.3.1, 3.3.16→3.3.18, 7.28.0→7.29.0—: sube
# el parche, no cambia de API.
#
# El selector `paquete@rango` acota el override a la major vulnerable. Sin él,
# `brace-expansion@1.1.18` (que NO está afectado: el aviso empieza en la 4.0.0)
# saltaría a la 5 y rompería a sus consumidores.
#
# Se revisan cuando Dependabot suba las directas: un override que ya no hace
# falta es deuda silenciosa.
overrides:
  postcss: "^8.5.23"
  sharp: "^0.35.0"
  brace-expansion@>=4.0.0: ">=5.0.9"
  fast-uri@>=3.0.0: ">=3.1.5"
  ip-address@<10.3.1: ">=10.3.1"
  js-yaml@>=4.0.0: ">=4.3.1"
  nanoid@<3.3.18: ">=3.3.18"
  undici@>=7.0.0: ">=7.29.0"

allowBuilds:
  core-js: true
  msw: true
  sharp: true
  unrs-resolver: true

patchedDependencies:
  '@ffmpeg/ffmpeg': patches/@ffmpeg__ffmpeg.patch
