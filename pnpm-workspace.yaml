packages:
  - "."

# Fuerza versiones parcheadas de dependencias transitivas que Next.js empaqueta
# en su propio árbol (postcss y sharp). Son bumps dentro de la misma major, sin
# cambios de API:
#   • postcss 8.4.31 → 8.5.x: herramienta de build de CSS; procesa el CSS del
#     propio proyecto (entrada de confianza), nunca entrada de un atacante.
#   • sharp 0.34 → 0.35: dep opcional de next/image; este proyecto usa
#     images.unoptimized, así que sharp ni se invoca en runtime.
# Sin esto, `pnpm audit --prod` reporta CVEs que en la práctica no son
# explotables aquí, pero que conviene cerrar para no enmascarar otras reales.
#
# Las seis de abajo cierran las 8 vulnerabilidades ALTAS que `pnpm audit`
# reportaba (F9). Las ocho eran TRANSITIVAS: ninguna dependencia directa está
# afectada, así que no hay nada que subir en package.json. Cada override es el
# parche MÍNIMO dentro de la major que ya estaba resuelta —5.0.7→5.0.9,
# 3.1.3→3.1.5, 10.2.0→10.3.1, 4.3.0→4.3.1, 3.3.16→3.3.18, 7.28.0→7.29.0—: sube
# el parche, no cambia de API.
#
# El selector `paquete@rango` acota el override a la major vulnerable. Sin él,
# `brace-expansion@1.1.18` (que NO está afectado: el aviso empieza en la 4.0.0)
# saltaría a la 5 y rompería a sus consumidores.
#
# Se revisan cuando Dependabot suba las directas: un override que ya no hace
# falta es deuda silenciosa.
#
# 2026-09-04 — dos ALTAS nuevas que la puerta de `pnpm audit` atrapo al activar
# la proteccion de rama. No son deuda heredada: este mismo job salio verde en
# main el 2026-08-16.
#   • browserslist 4.28.6 -> 4.28.7 (GHSA-c83g-rgw3-j3cx crecimiento de memoria
#     sin tope, GHSA-73wf-gq98-2v4g escritura de prototipo via
#     browserslist-stats.json). Transitiva via @babel/core; no estaba cubierta
#     por ningun override.
#   • fast-uri 4.1.2 -> 4.1.3 (confusion de host por canonicalizacion IDN
#     omitida). La causa no era el selector sino el DESTINO: el override
#     anterior, `fast-uri@>=3.0.0: ">=3.1.5"`, no tenia tope superior, asi que
#     el unico consumidor real (ajv@8, que declara `fast-uri: ^3.0.1`) terminaba
#     resuelto en 4.1.2 — una major que nunca pidio, y justo la rama vulnerable.
#     Ahora el destino esta acotado a la misma major que el selector, que es la
#     regla que el resto de este bloque ya seguia. La segunda linea queda como
#     guardia por si algun dia entra un consumidor de 4.x de verdad.
overrides:
  postcss: "^8.5.23"
  sharp: "^0.35.0"
  brace-expansion@>=4.0.0: ">=5.0.9"
  browserslist@<4.28.7: ">=4.28.7"
  "fast-uri@>=3.0.0 <4.0.0": ">=3.1.5 <4.0.0"
  fast-uri@>=4.0.0: ">=4.1.3"
  ip-address@<10.3.1: ">=10.3.1"
  js-yaml@>=4.0.0: ">=4.3.1"
  nanoid@<3.3.18: ">=3.3.18"
  undici@>=7.0.0: ">=7.29.0"

# `esbuild` y `workerd` los trae el adaptador de Cloudflare y necesitan su
# postinstall: descargan el binario nativo de la plataforma. Sin permitirlo,
# `opennextjs-cloudflare build` falla al no encontrar el runtime de Workers.
allowBuilds:
  core-js: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
  workerd: true

patchedDependencies:
  '@ffmpeg/ffmpeg': patches/@ffmpeg__ffmpeg.patch
